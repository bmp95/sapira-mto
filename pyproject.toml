[project]
name = "sapira-mto"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "openpyxl>=3.1", "google-genai>=1.0", "httpx>=0.27", "fastapi>=0.111", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "red: llama de verdad a una API externa (red + clave); se salta salvo que se pase --red",
]

[tool.setuptools]
packages = ["motor"]
